<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 450" fill="none">
  <defs>
    <linearGradient id="goldFoilLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7E8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#D4AF62" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#C5A04D" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#7A5818" stop-opacity="0.4" />
    </linearGradient>
    <filter id="embossLeft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#15020A" flood-opacity="0.9" />
    </filter>
  </defs>
  
  <g filter="url(#embossLeft)" stroke="url(#goldFoilLeft)" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Delicate Rose Motif -->
    <path d="M45 80 C50 68, 68 70, 72 82 C78 94, 62 106, 50 100 C38 96, 38 85, 45 80 Z" fill="url(#goldFoilLeft)" fill-opacity="0.2" />
    <path d="M54 82 C58 76, 65 78, 65 84 C65 90, 58 92, 54 88 Z" />
    <circle cx="59" cy="85" r="3" fill="url(#goldFoilLeft)" fill-opacity="0.75" />
    <path d="M68 75 C78 62, 92 72, 88 88" stroke-dasharray="2 3" />
    <path d="M42 75 C30 62, 18 78, 30 90" />
    
    <!-- Flowing Botanical Stem -->
    <path d="M58 100 Q 50 150 72 195 Q 90 235 80 280 Q 70 330 85 375" stroke-width="1.8" />
    
    <!-- Leaves Upper -->
    <path d="M52 125 C34 118, 28 134, 44 142 C52 136, 52 128, 52 125 Z" fill="url(#goldFoilLeft)" fill-opacity="0.25" />
    <path d="M65 155 C84 148, 90 166, 76 174 C68 170, 66 158, 65 155 Z" fill="url(#goldFoilLeft)" fill-opacity="0.25" />
    
    <!-- Centerpiece Majestic Rose -->
    <g transform="translate(20, 185)">
      <path d="M40 35 C35 18, 65 12, 76 30 C88 48, 64 66, 48 60 C30 54, 30 38, 40 35 Z" fill="url(#goldFoilLeft)" fill-opacity="0.25" />
      <path d="M48 32 C52 22, 64 24, 68 34 C68 44, 56 48, 48 42 Z" stroke-width="1.5" />
      <circle cx="57" cy="35" r="4" fill="url(#goldFoilLeft)" fill-opacity="0.85" />
      <!-- Outer Curving Petals -->
      <path d="M34 26 C20 18, 12 36, 26 48" />
      <path d="M78 24 C94 18, 102 38, 88 50" />
      <path d="M56 60 C58 76, 40 80, 34 65" />
      <path d="M72 52 C85 64, 76 80, 60 72" />
    </g>

    <!-- Lower Foliage and Leaves -->
    <path d="M75 295 C52 288, 46 308, 64 318 C75 312, 76 298, 75 295 Z" fill="url(#goldFoilLeft)" fill-opacity="0.28" />
    <path d="M84 330 C105 324, 110 346, 92 358 C82 352, 82 336, 84 330 Z" fill="url(#goldFoilLeft)" fill-opacity="0.28" />
    
    <!-- Berry Clusters -->
    <circle cx="28" cy="110" r="3" fill="url(#goldFoilLeft)" />
    <circle cx="36" cy="118" r="2.2" fill="url(#goldFoilLeft)" />
    <circle cx="24" cy="125" r="2.2" fill="url(#goldFoilLeft)" />
    
    <circle cx="102" cy="195" r="3" fill="url(#goldFoilLeft)" />
    <circle cx="110" cy="204" r="2.2" fill="url(#goldFoilLeft)" />
    <circle cx="98" cy="212" r="2.2" fill="url(#goldFoilLeft)" />
    
    <circle cx="48" cy="335" r="3" fill="url(#goldFoilLeft)" />
    <circle cx="40" cy="346" r="2.2" fill="url(#goldFoilLeft)" />
    <circle cx="54" cy="350" r="2.2" fill="url(#goldFoilLeft)" />
  </g>
</svg>

